name: ABSA offline checks

on:
  push:
    paths:
      - "turkish-absa/**"
      - ".github/workflows/absa-smoke.yml"
  pull_request:
    paths:
      - "turkish-absa/**"
      - ".github/workflows/absa-smoke.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies
        run: python -m pip install numpy scikit-learn
      - name: Compile source
        run: python -m compileall -q absa scripts run_all.py serve.py
        working-directory: turkish-absa
      - name: Run core tests
        run: python -m unittest discover -s tests -p 'test_core.py' -v
        working-directory: turkish-absa
